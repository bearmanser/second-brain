name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '24.21.0'
  PYTHON_VERSION: '3.12.3'
  GATE_LOGS: /tmp/opencode/ci-gate

jobs:
  fast:
    name: fast (typecheck, unit, contract, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: setup-node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: python worker unit tests (Python ${{ env.PYTHON_VERSION }})
        run: |
          set -euo pipefail
          python3 -c "import sys; assert sys.version.split()[0] == '${PYTHON_VERSION}', sys.version"
          python3 -m unittest discover -s workers/laya/tests -p 'test_*.py'
      - name: external-model-dependent tests
        run: |
          echo "NOT RUN: tests/eval/run.mts --mode instruction and --mode agent require an approved chat-model budget."
          echo "NOT RUN: the remote Streamable-HTTP MCP transport pilot requires a reachable client host."
          echo "NOT RUN: npm run test:laya and offline Laya artifact checks need prepared model snapshots on a target CPU host; CI runs the model-free python worker unit tests instead."
          echo "NOT RUN: npm run eval:retrieval --backend local --dataset /var/lib/second-brain/evaluations/retrieval.jsonl needs the real dataset; CI uses the committed tests/eval/fixtures/local-retrieval/dataset.jsonl fixture."
          echo "These are reported as NOT RUN, never as green."

  docker:
    name: docker (integration, e2e, single-container lifecycle)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: fast
    steps:
      - name: checkout (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: setup-node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: resolve pinned container inputs
        run: |
          set -euo pipefail
          for key in NODE_IMAGE PYTHON_IMAGE; do
            value="$(sed -n "s/^${key}=//p" config/images.env)"
            test -n "$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: pull pinned images
        run: |
          docker pull "$NODE_IMAGE"
          docker pull "$PYTHON_IMAGE"
      - run: npm ci
      - name: prepare the scratch workspace used by the Docker suites
        run: mkdir -p /tmp/opencode "$GATE_LOGS"
      - name: integration suites
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee "$GATE_LOGS/integration.log"
      - name: end-to-end suites (single-container deployment, offline, recovery)
        env:
          BRAIN_E2E_LIVE: '1'
        run: |
          set -o pipefail
          echo "e2e coverage: tests/e2e/{single-container,offline-local-brain,recovery,local-brain-v2-lifecycle}.test.ts"
          echo "retired two-service suites: tests/legacy/two-service/** (excluded by vitest.config.ts, never run in CI)"
          npm run test:e2e 2>&1 | tee "$GATE_LOGS/e2e.log"
      - name: upload gate transcripts (actions/upload-artifact v4.6.0)
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-gate-transcripts
          path: /tmp/opencode/ci-gate
          if-no-files-found: warn
