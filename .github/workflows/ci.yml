name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  FASTEMBED_MODEL: bge-small-en-v1.5-onnx-q

jobs:
  fast:
    name: fast (typecheck, unit, contract, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: retrieval evaluation (no chat model)
        run: npm run eval:retrieval
      - name: external-model-dependent tests
        run: |
          echo "NOT RUN: tests/eval/run.mts --mode instruction and --mode agent require an approved chat-model budget."
          echo "NOT RUN: the remote Streamable-HTTP MCP transport pilot requires a reachable client host."
          echo "These are reported as NOT RUN, never as green."

  docker:
    name: docker (integration and e2e against pinned images)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: resolve pinned dependency and container inputs
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync("config/images.env", "utf8").split("\n")) {
              const [key, ...rest] = line.split("=");
              if (key === "NODE_IMAGE" || key === "BASIC_MEMORY_IMAGE") {
                fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${rest.join("=")}\n`);
              }
            }
          '
          test -n "$NODE_IMAGE"
          test -n "$BASIC_MEMORY_IMAGE"
      - name: pull pinned images
        run: |
          docker pull "$NODE_IMAGE"
          docker pull "$BASIC_MEMORY_IMAGE"
      - name: restore FastEmbed model assets keyed by model and pinned backend digest
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fastembed-cache
          key: fastembed-${{ env.FASTEMBED_MODEL }}-${{ env.BASIC_MEMORY_IMAGE }}
      - run: npm ci
      - name: prepare the scratch workspace used by the Docker suites
        run: mkdir -p /tmp/opencode
      - name: integration suites
        env:
          BRAIN_E2E_MODEL_CACHE: ${{ runner.temp }}/fastembed-cache
        run: npm run test:integration
      - name: end-to-end suites against synthetic volumes
        env:
          BRAIN_E2E_MODEL_CACHE: ${{ runner.temp }}/fastembed-cache
        run: npm run test:e2e
      - name: external-model-dependent tests
        run: |
          echo "NOT RUN: instruction/agent pilot tests are opt-in and are not executed in CI."
