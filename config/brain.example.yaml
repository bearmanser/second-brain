# Second Brain gateway configuration (documented example).
#
# Copy this file to config/brain.yaml and adjust it for your deployment before
# running `docker compose up`. Configuration is validated on load; an invalid
# file fails closed with INVALID_INPUT. The single bearer-token digest is read
# from the BRAIN_TOKEN_SHA256 environment value and is never inlined here or
# committed to the repository.
#
# Redaction in logs is best-effort. It removes known credential patterns but
# cannot guarantee that captured note content contains no private data.

# Public MCP endpoint advertised to clients. The host is bound to loopback by
# the shipped Compose file: only the gateway endpoint is published.
endpoint: http://127.0.0.1:7331/mcp

# Listen port inside the gateway container.
port: 7331

# Server-owned mount paths. The vault is mounted read-only into the gateway;
# the state directory holds the operational SQLite database.
mounts:
  vault: /vault
  state: /var/lib/second-brain

# Persistent, independent HMAC-SHA256 key used to sign paginated brain_read
# cursors. `setup` generates a random 32-byte key at secrets/cursor-key and
# Compose exposes its path as BRAIN_CURSOR_SECRET (/run/secrets/brain_cursor).
# The key is never derived from note content and is never inlined here.
cursor_secret_file: /run/secrets/brain_cursor

# Exact Host header allowlist and optional Origin validation.
allowed_hosts:
  - 127.0.0.1:7331
  - localhost:7331

allowed_origins:
  - http://127.0.0.1:7331
  - http://localhost:7331

# Reserved static scopes map to separate vault roots and project records.
# Repository projects are normally created dynamically by brain_project_ensure
# and persisted in journal.db; they do not need entries here. The freellmapi
# entry below demonstrates compatibility with an explicitly pre-provisioned
# legacy scope.
scopes:
  - id: freellmapi
    backend_project: freellmapi
    relative_root: Projects/freellmapi
    repository_aliases:
      - freellmapi
      - free-llm-api
  - id: shared
    backend_project: shared
    relative_root: Shared
    repository_aliases: []
  - id: profile
    backend_project: profile
    relative_root: Profile
    repository_aliases: []

# Optional overrides. Omitted fields fall back to the Section C defaults.
limits:
  input_body_max_bytes: 262144
  rendered_note_max_bytes: 65536
  tool_result_max_bytes: 131072
  backend_timeout_ms: 15000
  materialization_timeout_ms: 10000
  reconcile_interval_ms: 30000
  concurrent_reads: 8
  project_provision_global_per_minute: 50
  dynamic_projects_max: 1000

# Tool-result delivery for MCP clients. `structured` (the default) sends the
# complete result in MCP structuredContent plus a compact text pointer. The
# `text-json` mode also carries the complete JSON result in the text block for
# clients that ignore structuredContent; the canonical structured payload is
# still present so the published output schemas stay valid. Choose `text-json`
# only after confirming with the installed client which representation it
# actually injects into the model context.
result_delivery: structured

# Retrieval mode. `text` never depends on the local Laya model. Enabling
# `reranked` requires `laya.enabled: true` (or BRAIN_LAYA_ENABLED=true) unless
# `search_fallback_only: true` explicitly records a lexical-fallback-only
# deployment; an inconsistent pair fails closed with INVALID_INPUT.
search_mode: text
search_fallback_only: false

# Local Laya reranker. Disabled by default; the operator prepares the immutable
# model snapshot explicitly and enables it only after the evaluated gate.
laya:
  enabled: false
  python: python3
  threads: 2
  batch_size: 8
  queue_batches: 4
  timeout_ms: 20000
