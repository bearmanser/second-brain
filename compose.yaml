name: second-brain
services:
  brain:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Run setup to load the pinned image reference}
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Run setup to load the pinned image reference}
    command: [serve]
    user: "${BRAIN_UID:-1000}:${BRAIN_GID:-1000}"
    ports:
      - "127.0.0.1:${BRAIN_PORT:-7331}:7331"
    environment:
      BRAIN_CONFIG: /run/brain/brain.yaml
      BRAIN_TOKEN_SHA256: ${BRAIN_TOKEN_SHA256:?Run setup to provision the token digest}
      BRAIN_HEALTH_TOKEN: /run/secrets/brain_token
      BRAIN_CURSOR_SECRET: /run/secrets/brain_cursor
      BRAIN_STATE_DIR: /var/lib/second-brain
      BRAIN_VAULT_DIR: /vault
      BRAIN_SEARCH_MODE: ${BRAIN_SEARCH_MODE:-text}
      BRAIN_SEARCH_FALLBACK_ONLY: ${BRAIN_SEARCH_FALLBACK_ONLY:-false}
      BRAIN_LAYA_ENABLED: ${BRAIN_LAYA_ENABLED:-false}
      BRAIN_LAYA_MODEL_DIR: ${BRAIN_LAYA_MODEL_DIR:-/var/lib/second-brain/models/laya/runtime}
      BRAIN_LAYA_BATCH_SIZE: ${BRAIN_LAYA_BATCH_SIZE:-8}
      BRAIN_LAYA_QUEUE_BATCHES: ${BRAIN_LAYA_QUEUE_BATCHES:-4}
      BRAIN_LAYA_TIMEOUT_MS: ${BRAIN_LAYA_TIMEOUT_MS:-4000}
      BRAIN_LAYA_THREADS: ${BRAIN_LAYA_THREADS:-2}
      BRAIN_RECONCILE_INTERVAL_MS: ${BRAIN_RECONCILE_INTERVAL_MS:-30000}
    volumes:
      - ${VAULT_PATH:-./vault}:/vault
      - ./config/brain.yaml:/run/brain/brain.yaml:ro
      - brain-state:/var/lib/second-brain
    secrets: [brain_token, brain_cursor]
    healthcheck:
      test: [CMD, node, dist/cli.js, health]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s
    init: true
    mem_limit: ${BRAIN_MEMORY_LIMIT:-6g}
    cpus: ${BRAIN_CPU_LIMIT:-2.0}
    pids_limit: 512
    stop_grace_period: 30s
    restart: unless-stopped
secrets:
  brain_token:
    file: ./secrets/brain-token
  brain_cursor:
    file: ./secrets/cursor-key
volumes:
  brain-state:
